[project]
name = "reminders-kanban"
version = "0.1.0b2"
requires-python = ">=3.11,<3.15"
dependencies = []

[dependency-groups]
dev = [
  "fastapi==0.133.1",
  "httpx",
  "pytest",
  "ruamel-yaml>=0.19.1",
  "ruff",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "live: touches real Apple Reminders or a real Hermes instance; deselected by default, run with -m live",
]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
